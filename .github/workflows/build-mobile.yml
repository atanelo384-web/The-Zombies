# Builds the phone versions in the cloud (free GitHub Actions).
#  - Android: app-debug.apk — install directly on any Android phone
#  - iPhone:  TheZombies-unsigned.ipa — install with Sideloadly / AltStore using your Apple ID
# Push the project to a GitHub repository, open the "Actions" tab, run "Build phone apps",
# then download the files from the run's "Artifacts" section.
name: Build apps (Android, iPhone, Windows)
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - run: node scripts/copy-web.mjs && npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk TheZombies-android.apk
      - uses: actions/upload-artifact@v4
        with: { name: TheZombies-android, path: mobile/TheZombies-android.apk }

  ios:
    runs-on: macos-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: node scripts/copy-web.mjs && npx cap sync ios
      - name: Build unsigned app
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -sdk iphoneos \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p Payload && cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr TheZombies-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with: { name: TheZombies-iphone, path: mobile/TheZombies-unsigned.ipa }
      # also keep the IPA in the "builds" branch so it can be fetched with plain git
      - name: Publish IPA to the builds branch
        run: |
          mkdir -p /tmp/pub && cp TheZombies-unsigned.ipa /tmp/pub/
          cd /tmp/pub && git init -q -b builds && git add TheZombies-unsigned.ipa
          git -c user.name=github-actions -c user.email=actions@github.com commit -qm "IPA ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" builds

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npx electron-builder --win nsis --x64 --publish never
      - uses: actions/upload-artifact@v4
        with: { name: TheZombies-windows, path: release/*.exe }
      - name: Publish installer to the builds-win branch
        shell: bash
        run: |
          mkdir -p /tmp/pubw && cp release/*.exe /tmp/pubw/
          cd /tmp/pubw && git init -q -b builds-win && git add . 
          git -c user.name=github-actions -c user.email=actions@github.com commit -qm "Windows ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" builds-win

# Builds the phone versions in the cloud (free GitHub Actions).
#  - Android: app-debug.apk — install directly on any Android phone
#  - iPhone:  TheZombies-unsigned.ipa — install with Sideloadly / AltStore using your Apple ID
# Push the project to a GitHub repository, open the "Actions" tab, run "Build phone apps",
# then download the files from the run's "Artifacts" section.
name: Build phone apps
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  android:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - run: node scripts/copy-web.mjs && npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk TheZombies-android.apk
      - uses: actions/upload-artifact@v4
        with: { name: TheZombies-android, path: mobile/TheZombies-android.apk }

  ios:
    runs-on: macos-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: node scripts/copy-web.mjs && npx cap sync ios
      - name: Build unsigned app
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -sdk iphoneos \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p Payload && cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr TheZombies-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with: { name: TheZombies-iphone, path: mobile/TheZombies-unsigned.ipa }
